[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.poetry]
name = "data-extraction"
version = "0.1.0"
description = "Invoice Data Extraction API"
authors = ["you <taklikarbharat8@gmail.com>"]
readme = "readme.md"

[tool.poetry.dependencies]
python = "^3.8"
fastapi = "*"

[tool.poetry.scripts]
app = "api:app"

[project]
name = "data-extraction"
version = "0.1.0"
description = "Invoice Data Extraction API"
readme = "readme.md"
requires-python = ">=3.8"
dependencies = [
	"fastapi",
	"uvicorn[standard]",
	"pdfplumber==0.10.4",
	"pytesseract==0.3.10",
	"Pillow==10.1.0",
	"opencv-python-headless==4.8.1.78",
	"pandas==2.1.3",
	"openpyxl==3.1.2",
	"numpy==1.26.2"
]

[project.scripts]
app = "api:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["core", "cli"]

